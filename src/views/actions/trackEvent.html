<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="https://assets.adobedtm.com/extensions/v7/bridge.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            font-size: 13px;
            margin: 16px;
        }

        .field {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }

        select,
        input[type="text"] {
            width: 300px;
            padding: 4px;
        }
    </style>
</head>

<body>
    <div class="field">
        <label for="eventName">Standard Event Name</label>
        <select id="eventName" onchange="toggleCustom()">
            <option value="PageView">PageView</option>
            <option value="ViewContent">ViewContent</option>
            <option value="AddToCart">AddToCart</option>
            <option value="AddPaymentInfo">AddPaymentInfo</option>
            <option value="InitiateCheckout">InitiateCheckout</option>
            <option value="Purchase">Purchase</option>
            <option value="CompleteRegistration">CompleteRegistration</option>
            <option value="Contact">Contact</option>
            <option value="Search">Search</option>
            <option value="CustomizeProduct">CustomizeProduct</option>
            <option value="AddToWishlist">AddToWishlist</option>
            <option value="Custom">Custom Event...</option>
        </select>
    </div>

    <div class="field" id="customGroup" style="display:none;">
        <label for="customEventName">Custom Event Name</label>
        <input type="text" id="customEventName" />
    </div>

    <script>
        function toggleCustom() {
            var val = document.getElementById('eventName').value;
            document.getElementById('customGroup').style.display = (val === 'Custom') ? 'block' : 'none';
        }

        window.extensionBridge.register({
            init: function (info) {
                if (info.settings) {
                    document.getElementById('eventName').value = info.settings.eventName || 'PageView';
                    document.getElementById('customEventName').value = info.settings.customEventName || '';
                    toggleCustom();
                }
            },
            getSettings: function () {
                return {
                    eventName: document.getElementById('eventName').value,
                    customEventName: document.getElementById('customEventName').value.trim()
                };
            },
            validate: function () {
                var name = document.getElementById('eventName').value;
                if (name === 'Custom') {
                    return document.getElementById('customEventName').value.trim().length > 0;
                }
                return true;
            }
        });
    </script>
</body>

</html>
